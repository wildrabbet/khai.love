<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>khai.love</title>
<meta name="description" content="khai.love — something is being built here.">
<meta property="og:title" content="khai.love">
<meta property="og:description" content="Something is being built here.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://khai.love/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128153;</text></svg>">
<style>
  :root {
    --bg: #0b0a0f;
    --fg: #f4f1ee;
    --muted: #8f8a9c;
    --accent: #ff5c8a;
    --accent-2: #7c6cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #fbf9f7;
      --fg: #16141c;
      --muted: #6f6a7c;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 6vmin;
    overflow: hidden;
  }
  /* soft drifting glow behind the wordmark */
  body::before {
    content: "";
    position: fixed;
    inset: -30%;
    background:
      radial-gradient(38vmax 38vmax at 32% 38%, color-mix(in oklab, var(--accent) 42%, transparent), transparent 62%),
      radial-gradient(34vmax 34vmax at 68% 62%, color-mix(in oklab, var(--accent-2) 40%, transparent), transparent 62%);
    filter: blur(60px);
    opacity: .5;
    animation: drift 24s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes drift {
    from { transform: translate3d(-3%, -2%, 0) scale(1); }
    to   { transform: translate3d(3%, 2%, 0) scale(1.12); }
  }
  main { position: relative; z-index: 1; }
  h1 {
    margin: 0;
    font-size: clamp(2.75rem, 14vw, 8rem);
    font-weight: 600;
    letter-spacing: -0.04em;
    line-height: 1;
  }
  h1 .dot { color: var(--accent); }
  p {
    margin: 1.25rem 0 0;
    color: var(--muted);
    font-size: clamp(0.95rem, 2.6vw, 1.125rem);
    letter-spacing: 0.01em;
  }
  .pulse {
    display: inline-block;
    width: .5em;
    height: .5em;
    margin-right: .55em;
    border-radius: 50%;
    background: var(--accent);
    vertical-align: baseline;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; transform: scale(.85); }
    50%      { opacity: 1;   transform: scale(1.15); }
  }
  footer {
    position: fixed;
    bottom: 5vmin;
    left: 0;
    right: 0;
    z-index: 1;
    color: var(--muted);
    font-size: .8125rem;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  @media (prefers-reduced-motion: reduce) {
    body::before, .pulse { animation: none; }
  }
</style>
</head>
<body>
  <main>
    <h1>khai<span class="dot">.</span>love</h1>
    <p><span class="pulse" aria-hidden="true"></span>Under construction — something is being built here.</p>
  </main>
  <footer>khai.love</footer>
</body>
</html>
